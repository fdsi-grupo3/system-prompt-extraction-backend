server:
  port: 8080

spring:
  application:
    name: fdsi-gp03-backend

# Configuración del proveedor LLM (Gemini).
# Se usan DOS API keys independientes, tal como exige la arquitectura Secure:
#   - "security": Input Guard (clasificador de intención) y Output Filter (si se apoya en LLM).
#   - "main":     LLM principal que genera la respuesta institucional al usuario.
llm:
  base-url: https://generativelanguage.googleapis.com/v1beta
  security:
    api-key: ${GEMINI_SECURITY_API_KEY:}
    model: ${GEMINI_SECURITY_MODEL:gemini-3.5-flash-lite}
  main:
    api-key: ${GEMINI_MAIN_API_KEY:}
    model: ${GEMINI_MAIN_MODEL:gemini-3.8-flash}

app:
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:5173}
  input-guard:
    enabled: ${INPUT_GUARD_ENABLED:true}
  output-filter:
    enabled: ${OUTPUT_FILTER_ENABLED:true}
    # Detector: ml (clasificador de IA propio, con fallback léxico si no está disponible),
    # lexical (detector original por similitud) o hybrid (bloquea si cualquiera detecta fuga).
    engine: ${OUTPUT_FILTER_ENGINE:ml}
    # Similitud (0-1) del detector LÉXICO contra fragmentos protegidos a partir de la cual
    # se bloquea la respuesta. El umbral del detector de IA vive en el propio servicio
    # (calibrado en validación, ver filter_config.json del modelo).
    threshold: ${OUTPUT_FILTER_THRESHOLD:0.45}
    ml:
      # Servicio FastAPI del proyecto system-prompt-extraction-ml-filter.
      base-url: ${OUTPUT_FILTER_ML_URL:http://localhost:8001}
      connect-timeout-ms: ${OUTPUT_FILTER_ML_CONNECT_TIMEOUT_MS:500}
      read-timeout-ms: ${OUTPUT_FILTER_ML_READ_TIMEOUT_MS:2000}
      # Secreto compartido (header X-Filter-Token); vacío = sin autenticación.
      api-token: ${OUTPUT_FILTER_ML_API_TOKEN:}
