<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1060" width="1480" height="1060" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>FDSI-GP-03 · Arquitectura Secure con Output Filter de IA propia</title>
  <defs>
    <marker id="a-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="a-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker>
  </defs>

  <rect x="0" y="0" width="1480" height="1060" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="42" font-size="22" font-weight="700" fill="#0f172a">FDSI-GP-03 · Arquitectura Secure con Output Filter de IA propia</text>
  <text x="40" y="66" font-size="13" fill="#475569">Asistente institucional INTS · Prompt Hardening + Input Guard + LLM principal + Output Filter (clasificador entrenado, independiente de Gemini)</text>

  <!-- Fila superior: usuario y frontend -->
  <rect x="40" y="86" width="170" height="60" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="125" y="113" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">Usuario</text>
  <text x="125" y="131" font-size="12" fill="#475569" text-anchor="middle">navegador</text>

  <rect x="250" y="86" width="430" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="465" y="111" font-size="14" font-weight="600" fill="#1e1b4b" text-anchor="middle">Frontend · React 19 + Vite + Tailwind · :5173</text>
  <text x="465" y="130" font-size="12" fill="#3730a3" text-anchor="middle">chat · modo Secure / Unsecure · insignias de bloqueo · pestaña Logs</text>
  <line x1="210" y1="116" x2="248" y2="116" stroke="#475569" stroke-width="1.6" marker-end="url(#a-gray)"/>

  <!-- Frontend <-> Backend -->
  <line x1="390" y1="146" x2="390" y2="228" stroke="#475569" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="398" y="172" font-size="11.5" fill="#334155">POST /api/chat {message, sessionId}</text>
  <text x="398" y="186" font-size="11.5" fill="#334155">(también /api/chat/unsecure y GET /api/logs)</text>
  <line x1="640" y1="228" x2="640" y2="146" stroke="#475569" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="648" y="172" font-size="11.5" fill="#334155">ChatResponse {reply, blocked,</text>
  <text x="648" y="186" font-size="11.5" fill="#334155">blockedBy, latencyMs, sessionId, error}</text>

  <!-- Contenedor backend -->
  <rect x="40" y="198" width="1100" height="412" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="58" y="218" font-size="13" font-weight="700" fill="#0f172a">Backend · Spring Boot 3.3 · Java 21 · :8080</text>

  <rect x="60" y="230" width="1060" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="590" y="250" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">ChatController → ChatOrchestrationService</text>
  <text x="590" y="266" font-size="11.5" fill="#475569" text-anchor="middle">valida sessionId (UUID, si no → nuevo) · encadena las 3 capas · cualquier bloqueo devuelve el MISMO mensaje genérico</text>

  <!-- Llamadas a Gemini (rutas por encima de las etapas) -->
  <polyline points="215,320 215,292 1290,292 1290,318" fill="none" stroke="#ea580c" stroke-width="1.8" marker-end="url(#a-orange)"/>
  <polyline points="585,320 585,304 1340,304 1340,318" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#a-blue)"/>

  <!-- Controlador -> Input Guard -->
  <line x1="120" y1="274" x2="120" y2="318" stroke="#475569" stroke-width="1.6" marker-end="url(#a-gray)"/>

  <!-- Etapa 1: Input Guard -->
  <rect x="60" y="320" width="310" height="190" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="76" y="344" font-size="15" font-weight="700" fill="#9a3412">① Input Guard</text>
  <text x="76" y="366" font-size="12.5" fill="#431407">1. Normalización (invisibles, homoglifos)</text>
  <text x="76" y="384" font-size="12.5" fill="#431407">2. Regex de patrones conocidos</text>
  <text x="76" y="402" font-size="12.5" fill="#431407">3. Combinación verbo + objetivo</text>
  <text x="76" y="420" font-size="12.5" fill="#431407">4. Clasificador LLM ALLOW / BLOCK</text>
  <text x="76" y="437" font-size="12" fill="#7c2d12">    Gemini key «security», 2 intentos</text>
  <text x="76" y="455" font-size="12.5" fill="#431407">5. Respaldo heurístico si el LLM falla</text>
  <text x="76" y="490" font-size="12" font-weight="600" fill="#b91c1c">BLOCK → mensaje genérico + log</text>

  <!-- Etapa 2: LLM principal -->
  <line x1="370" y1="415" x2="428" y2="415" stroke="#475569" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="399" y="406" font-size="11" fill="#334155" text-anchor="middle">ALLOW</text>
  <rect x="430" y="320" width="310" height="190" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="446" y="344" font-size="15" font-weight="700" fill="#1e3a8a">② LLM principal</text>
  <text x="446" y="366" font-size="12.5" fill="#172554">SystemPromptService (Prompt Hardening):</text>
  <text x="446" y="384" font-size="12.5" fill="#172554">reglas confidenciales + anti-extracción</text>
  <text x="446" y="402" font-size="12.5" fill="#172554">+ recordatorio «sandwich defense»</text>
  <text x="446" y="420" font-size="12.5" fill="#172554">GeminiClientService → Gemini key «main»</text>
  <text x="446" y="438" font-size="12.5" fill="#172554">temperatura 0.4 · máx. 800 tokens</text>
  <text x="446" y="490" font-size="12" font-weight="600" fill="#475569">fallo técnico → error controlado</text>

  <!-- Etapa 3: Output Filter -->
  <line x1="740" y1="415" x2="798" y2="415" stroke="#475569" stroke-width="1.6" marker-end="url(#a-gray)"/>
  <text x="769" y="406" font-size="11" fill="#334155" text-anchor="middle">borrador</text>
  <rect x="800" y="320" width="320" height="190" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="816" y="344" font-size="15" font-weight="700" fill="#991b1b">③ Output Filter</text>
  <rect x="948" y="331" width="58" height="18" rx="9" fill="#dc2626"/>
  <text x="977" y="344" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">NUEVO</text>
  <text x="816" y="366" font-size="12.5" fill="#450a0a">OutputFilterService · engine:</text>
  <text x="816" y="384" font-size="12.5" fill="#450a0a">ml (default) · lexical · hybrid</text>
  <text x="816" y="402" font-size="12.5" fill="#450a0a">historial: 5 respuestas por sesión</text>
  <text x="816" y="420" font-size="12.5" fill="#450a0a">MlFilterClient → POST /api/output-filter</text>
  <text x="816" y="438" font-size="12.5" fill="#450a0a">timeouts 500 ms / 2 s · token opcional</text>
  <text x="816" y="456" font-size="12.5" fill="#450a0a">si la IA no responde → detector léxico</text>
  <text x="816" y="490" font-size="12" font-weight="600" fill="#b91c1c">fuga → mensaje genérico + log</text>

  <!-- Fila de servicios de soporte -->
  <rect x="60" y="535" width="250" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="185" y="558" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">AttackLogService · GET /api/logs</text>
  <text x="185" y="576" font-size="11.5" fill="#475569" text-anchor="middle">registro en memoria de bloqueos</text>

  <rect x="330" y="535" width="250" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="455" y="558" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">POST /api/chat/unsecure</text>
  <text x="455" y="576" font-size="11.5" fill="#475569" text-anchor="middle">solo LLM, sin controles (A/B)</text>

  <rect x="600" y="535" width="250" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="725" y="558" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">GlobalExceptionHandler · /health</text>
  <text x="725" y="576" font-size="11.5" fill="#475569" text-anchor="middle">errores genéricos, sin stack trace</text>

  <rect x="870" y="535" width="250" height="56" rx="8" fill="#fff1f2" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="995" y="558" font-size="12.5" font-weight="600" fill="#7f1d1d" text-anchor="middle">LexicalLeakDetector</text>
  <text x="995" y="576" font-size="11.5" fill="#7f1d1d" text-anchor="middle">fallback y segunda opinión (hybrid)</text>
  <line x1="995" y1="510" x2="995" y2="533" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#a-red)"/>

  <!-- Gemini (externo) -->
  <rect x="1180" y="320" width="270" height="190" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="1315" y="346" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Google Gemini API</text>
  <text x="1315" y="364" font-size="12" fill="#5b21b6" text-anchor="middle">externo · generateContent</text>
  <line x1="1196" y1="384" x2="1222" y2="384" stroke="#ea580c" stroke-width="3"/>
  <text x="1230" y="388" font-size="12.5" fill="#2e1065">key «security»</text>
  <text x="1230" y="405" font-size="11.5" fill="#5b21b6">clasificador del Input Guard</text>
  <line x1="1196" y1="430" x2="1222" y2="430" stroke="#2563eb" stroke-width="3"/>
  <text x="1230" y="434" font-size="12.5" fill="#2e1065">key «main»</text>
  <text x="1230" y="451" font-size="11.5" fill="#5b21b6">respuesta institucional</text>
  <text x="1315" y="490" font-size="11.5" fill="#6d28d9" text-anchor="middle">El Output Filter NO usa Gemini</text>

  <!-- Output Filter <-> servicio IA -->
  <polyline points="1120,470 1160,470 1160,700 1142,700" fill="none" stroke="#16a34a" stroke-width="2" marker-start="url(#a-green)" marker-end="url(#a-green)"/>
  <text x="1172" y="570" font-size="12" font-weight="600" fill="#14532d">POST /api/output-filter</text>
  <text x="1172" y="587" font-size="11.5" fill="#166534">→ response, protected_fragments,</text>
  <text x="1172" y="602" font-size="11.5" fill="#166534">   history, session_id</text>
  <text x="1172" y="620" font-size="11.5" fill="#166534">← is_leak, score, threshold,</text>
  <text x="1172" y="635" font-size="11.5" fill="#166534">   matched_view, accumulated</text>

  <!-- Servicio de IA -->
  <rect x="40" y="650" width="1100" height="210" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="58" y="676" font-size="14" font-weight="700" fill="#14532d">Servicio de IA · FastAPI + ONNX Runtime · :8001</text>
  <text x="430" y="676" font-size="12" fill="#166534">proyecto system-prompt-extraction-ml-filter · no registra el texto de las respuestas</text>

  <rect x="60" y="696" width="250" height="140" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="76" y="718" font-size="13.5" font-weight="700" fill="#14532d">Preprocesamiento</text>
  <text x="76" y="738" font-size="12" fill="#052e16">NFKC · sin invisibles</text>
  <text x="76" y="755" font-size="12" fill="#052e16">homoglifos → latino</text>
  <text x="76" y="772" font-size="12" fill="#052e16">decodifica Base64 y hex</text>
  <text x="76" y="789" font-size="12" fill="#052e16">ROT13 · invertido · leetspeak</text>
  <text x="76" y="806" font-size="12" fill="#052e16">+ vista acumulada de la sesión</text>
  <text x="76" y="823" font-size="11" fill="#166534">= varias «vistas» de la respuesta</text>

  <line x1="310" y1="766" x2="338" y2="766" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <rect x="340" y="696" width="220" height="140" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="356" y="718" font-size="13.5" font-weight="700" fill="#14532d">Ventanas y pares</text>
  <text x="356" y="738" font-size="12" fill="#052e16">ventanas ≤ 600 caracteres</text>
  <text x="356" y="755" font-size="12" fill="#052e16">con solapamiento</text>
  <text x="356" y="772" font-size="12" fill="#052e16">pares (fragmento, ventana)</text>
  <text x="356" y="789" font-size="12" fill="#052e16">7 fragmentos × ventanas</text>
  <text x="356" y="806" font-size="12" fill="#052e16">× vistas, en un lote</text>

  <line x1="560" y1="766" x2="588" y2="766" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <rect x="590" y="696" width="290" height="140" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="606" y="718" font-size="13.5" font-weight="700" fill="#14532d">Cross-encoder Transformer</text>
  <text x="606" y="738" font-size="12" fill="#052e16">paraphrase-multilingual-MiniLM-L12-v2</text>
  <text x="606" y="755" font-size="12" fill="#052e16">fine-tuned con ~3.000 pares propios</text>
  <text x="606" y="772" font-size="12" fill="#052e16">ONNX INT8 · 118 MB · CPU</text>
  <text x="606" y="789" font-size="12" fill="#052e16">entrada: [fragmento] [SEP] [ventana]</text>
  <text x="606" y="806" font-size="12" fill="#052e16">salida: P(fuga) por par</text>

  <line x1="880" y1="766" x2="908" y2="766" stroke="#16a34a" stroke-width="1.6" marker-end="url(#a-green)"/>
  <rect x="910" y="696" width="210" height="140" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="1.2"/>
  <text x="926" y="718" font-size="13.5" font-weight="700" fill="#14532d">Decisión</text>
  <text x="926" y="738" font-size="12" fill="#052e16">score = máx. P(fuga)</text>
  <text x="926" y="755" font-size="12" fill="#052e16">score ≥ 0.37 → fuga</text>
  <text x="926" y="772" font-size="12" fill="#052e16">umbral calibrado</text>
  <text x="926" y="789" font-size="12" fill="#052e16">solo con validación</text>
  <text x="926" y="806" font-size="12" fill="#052e16">+ fragmento y vista</text>

  <!-- Entrenamiento offline -->
  <rect x="40" y="890" width="1100" height="150" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="58" y="914" font-size="14" font-weight="700" fill="#334155">Entrenamiento (offline, se ejecuta una vez y produce models/leakfilter-v1)</text>

  <g font-size="11.5" fill="#1e293b" text-anchor="middle">
    <rect x="60" y="930" width="160" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="140" y="954" font-weight="700">Corpus semilla</text>
    <text x="140" y="972">7 prompts escritos</text>
    <text x="140" y="988">a mano + casos</text>
    <text x="140" y="1004">manuales y sondas</text>

    <rect x="240" y="930" width="160" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="320" y="954" font-weight="700">synth.py</text>
    <text x="320" y="972">fugas por vector</text>
    <text x="320" y="988">+ negativos difíciles</text>
    <text x="320" y="1004">+ contrastivos</text>

    <rect x="420" y="930" width="160" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="500" y="954" font-weight="700">build_dataset.py</text>
    <text x="500" y="972">split 80/10/10</text>
    <text x="500" y="988">por grupo + prompt</text>
    <text x="500" y="1004">reservado + e2e</text>

    <rect x="600" y="930" width="160" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="680" y="954" font-weight="700">train.py</text>
    <text x="680" y="972">fine-tuning en CPU</text>
    <text x="680" y="988">2 épocas · AdamW</text>
    <text x="680" y="1004">calibra el umbral</text>

    <rect x="780" y="930" width="160" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="860" y="954" font-weight="700">export_onnx.py</text>
    <text x="860" y="972">ONNX FP32</text>
    <text x="860" y="988">→ cuantización INT8</text>
    <text x="860" y="1004">+ verificación</text>

    <rect x="960" y="930" width="160" height="90" rx="8" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1040" y="954" font-weight="700">evaluate.py</text>
    <text x="1040" y="972">probe.py</text>
    <text x="1040" y="988">métricas por vector</text>
    <text x="1040" y="1004">vs. filtro léxico</text>
  </g>
  <g stroke="#64748b" stroke-width="1.4">
    <line x1="220" y1="975" x2="238" y2="975" marker-end="url(#a-gray)"/>
    <line x1="400" y1="975" x2="418" y2="975" marker-end="url(#a-gray)"/>
    <line x1="580" y1="975" x2="598" y2="975" marker-end="url(#a-gray)"/>
    <line x1="760" y1="975" x2="778" y2="975" marker-end="url(#a-gray)"/>
    <line x1="940" y1="975" x2="958" y2="975" marker-end="url(#a-gray)"/>
  </g>
  <line x1="860" y1="930" x2="860" y2="838" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#a-gray)"/>
  <text x="868" y="882" font-size="11.5" fill="#334155">modelo + tokenizer + umbral</text>

  <!-- Leyenda -->
  <rect x="1180" y="700" width="270" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1196" y="724" font-size="13" font-weight="700" fill="#0f172a">Leyenda</text>
  <line x1="1196" y1="746" x2="1230" y2="746" stroke="#475569" stroke-width="2"/>
  <text x="1240" y="750" font-size="12" fill="#334155">flujo de la solicitud</text>
  <line x1="1196" y1="770" x2="1230" y2="770" stroke="#ea580c" stroke-width="2"/>
  <text x="1240" y="774" font-size="12" fill="#334155">Gemini key «security»</text>
  <line x1="1196" y1="794" x2="1230" y2="794" stroke="#2563eb" stroke-width="2"/>
  <text x="1240" y="798" font-size="12" fill="#334155">Gemini key «main»</text>
  <line x1="1196" y1="818" x2="1230" y2="818" stroke="#16a34a" stroke-width="2"/>
  <text x="1240" y="822" font-size="12" fill="#334155">IA propia (HTTP interno)</text>
  <line x1="1196" y1="842" x2="1230" y2="842" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="1240" y="846" font-size="12" fill="#334155">fallback si la IA falla</text>
  <line x1="1196" y1="866" x2="1230" y2="866" stroke="#64748b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="1240" y="870" font-size="12" fill="#334155">offline (entrenamiento)</text>
  <text x="1196" y="900" font-size="11.5" fill="#475569">Un bloqueo en cualquier capa</text>
  <text x="1196" y="916" font-size="11.5" fill="#475569">devuelve la misma respuesta genérica:</text>
  <text x="1196" y="932" font-size="11.5" fill="#475569">no revela qué control actuó.</text>
</svg>
